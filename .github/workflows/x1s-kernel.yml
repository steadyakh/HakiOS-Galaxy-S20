# Public source-only build of the x1s kernel with the opt-in metal=2 switch.
# Upstream HakiOS stays on the ephemeral Linux runner; this repo holds only
# patches. The metal=2 patch (patches/12-metal-switch) names the RedwoodMetal
# plug-in; the plug-in itself is built by .github/workflows/x1s-mesa.yml.
name: x1s kernel
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'patches/**'
      - '.github/workflows/x1s-kernel.yml'
      - 'CREDITS.md'
permissions:
  contents: read
concurrency:
  group: x1s-kernel-${{ github.ref }}
  cancel-in-progress: false
env:
  THEOS: /home/runner/theos
  X1S_CMDLINE: "-v cpus=1 exynos_thermal=1 hello_wait=12 loader_return_after=30"
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
        working-directory: hakios
    steps:
      - uses: actions/checkout@v4
        with:
          path: port
          persist-credentials: false
      - name: Read pinned upstream
        id: upstream
        working-directory: port
        run: |
          base=$(tr -d '\r\n' < patches/UPSTREAM_BASE)
          [[ "$base" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$base" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: oosexgang/hakios-xnu-kernel
          ref: ${{ steps.upstream.outputs.sha }}
          path: hakios
          persist-credentials: false
      - name: Apply the public patches in order
        run: |
          export LC_ALL=C
          for p in ../port/patches/*/*.patch; do
            echo "Applying $p"
            git apply --check "$p"
            git apply "$p"
          done
          grep -q 'metal == 2' xnu/files/iokit/Kernel/MiniIOMobileFramebuffer.cpp

      - name: Packages
        timeout-minutes: 20
        run: |
          apt_opts="-o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=3"
          for try in 1 2 3; do sudo timeout 300 apt-get $apt_opts update && break; done
          for try in 1 2 3; do
            sudo timeout 600 apt-get $apt_opts install -y git curl tar xz-utils make build-essential clang lld llvm \
              flex bison m4 perl python3 python3-venv autoconf automake libtool uuid-dev libssl-dev cpio && break
          done
      - name: theos's Linux iOS toolchain and the iPhoneOS 16.5 SDK
        run: |
          mkdir -p "$THEOS/toolchain" "$THEOS/sdks"
          curl -fsSL --retry 3 https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz \
            | tar -xJ -C "$THEOS/toolchain"
          test -x "$THEOS/toolchain/linux/iphone/bin/ld"
          git clone -q --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git "$THEOS/sdks-git"
          git -C "$THEOS/sdks-git" sparse-checkout set iPhoneOS16.5.sdk
          ln -s ../sdks-git/iPhoneOS16.5.sdk "$THEOS/sdks/iPhoneOS16.5.sdk"
          test -d "$THEOS/sdks/iPhoneOS16.5.sdk/usr/include"

      - name: The kernel
        run: |
          set -o pipefail
          mkdir -p logs
          { xnu/apply.sh && xnu-deps/setup.sh && ./xnu-build.sh -j$(nproc) -k; } > logs/kernel-build.log 2>&1 || true
          grep -nE 'setup:|error:|Error [0-9]|No such file|not found|command not found' logs/kernel-build.log | head -n 60 || true
          K=xnu-src/xnu-8796.121.2/BUILD/obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837
          test -f "$K" || { echo "no kernel was built"; tail -n 60 logs/kernel-build.log; exit 1; }
          ls -la "$K"
          mkdir -p kernel-out
          cp "$K" kernel-out/kernel-x1s
          echo "$X1S_CMDLINE" > kernel-out/cmdline.txt
          cp logs/kernel-build.log kernel-out/
          (cd kernel-out && sha256sum * | tee SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: x1s-kernel-metal2
          path: hakios/kernel-out/
          retention-days: 14
          if-no-files-found: error
