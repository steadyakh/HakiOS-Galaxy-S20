name: x1s CPU boost test kernel
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/x1s-cpu-test.yml'
      - 'experiments/x1s-cpu-boost.patch'
permissions:
  contents: read
env:
  THEOS: /home/runner/theos
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
        working-directory: hakios
    steps:
      - uses: actions/checkout@v4
        with:
          path: port
          persist-credentials: false
      - name: Read pinned upstream
        id: upstream
        working-directory: port
        run: |
          base=$(tr -d '\r\n' < patches/UPSTREAM_BASE)
          [[ "$base" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$base" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: oosexgang/hakios-xnu-kernel
          ref: ${{ steps.upstream.outputs.sha }}
          path: hakios
          persist-credentials: false
      - name: Apply the public port and the isolated CPU change
        run: |
          export LC_ALL=C
          for p in ../port/patches/*/*.patch ../port/experiments/x1s-cpu-boost.patch; do
            git apply --check "$p"
            git apply "$p"
          done
      - name: Packages
        timeout-minutes: 20
        run: |
          apt_opts="-o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=3"
          for try in 1 2 3; do sudo timeout 300 apt-get $apt_opts update && break; done
          for try in 1 2 3; do
            sudo timeout 600 apt-get $apt_opts install -y git curl tar xz-utils make build-essential clang lld llvm \
              flex bison m4 perl python3 python3-venv autoconf automake libtool uuid-dev libssl-dev cpio && break
          done

      - name: theos's Linux iOS toolchain and the iPhoneOS 16.5 SDK
        run: |
          mkdir -p "$THEOS/toolchain" "$THEOS/sdks"
          curl -fsSL --retry 3 https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz \
            | tar -xJ -C "$THEOS/toolchain"
          test -x "$THEOS/toolchain/linux/iphone/bin/ld"
          git clone -q --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git "$THEOS/sdks-git"
          git -C "$THEOS/sdks-git" sparse-checkout set iPhoneOS16.5.sdk
          ln -s ../sdks-git/iPhoneOS16.5.sdk "$THEOS/sdks/iPhoneOS16.5.sdk"
          test -d "$THEOS/sdks/iPhoneOS16.5.sdk/usr/include"

      - name: Build the HakiOS kernel
        run: |
          mkdir -p logs
          xnu/apply.sh > logs/kernel-build.log 2>&1 || { tail -n 80 logs/kernel-build.log; exit 1; }
          xnu-deps/setup.sh >> logs/kernel-build.log 2>&1 || { tail -n 80 logs/kernel-build.log; exit 1; }
          # XNU's export-list checks can fail after the fresh kernel has been linked.
          build_status=0
          ./xnu-build.sh -j"$(nproc)" -k >> logs/kernel-build.log 2>&1 || build_status=$?
          kernel=xnu-src/xnu-8796.121.2/BUILD/obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837
          if ! test -s "$kernel" || ! grep -aFq 'cpu_gov: no worker available; off' "$kernel"; then
            grep -nE 'error:|Error [0-9]|No such file|undefined|command not found' logs/kernel-build.log | head -n 60 || true
            tail -n 40 logs/kernel-build.log
            exit 1
          fi
          if (( build_status != 0 )); then
            echo "::warning::Make returned $build_status after producing the kernel. The fresh output passed the candidate check."
          fi
          mkdir ../out-cpu-kernel
          cp "$kernel" ../out-cpu-kernel/kernel-x1s
          cp ../port/patches/UPSTREAM_BASE ../out-cpu-kernel/UPSTREAM_BASE
          git -C ../port rev-parse HEAD > ../out-cpu-kernel/PORT_COMMIT
          cd ../out-cpu-kernel
          sha256sum kernel-x1s UPSTREAM_BASE PORT_COMMIT > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: x1s-cpu-test-kernel
          path: |
            out-cpu-kernel/kernel-x1s
            out-cpu-kernel/UPSTREAM_BASE
            out-cpu-kernel/PORT_COMMIT
            out-cpu-kernel/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
